
{% extends 'base.html' %}

{% block title %}Login | Cloud Restro{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card auth-card">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1>Welcome Back!</h1>
                            <p class="text-muted">
                                Login to enjoy your favourite meals.
                            </p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter your username"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required
                                >
                            </div>

                            <button type="submit" class="btn cloud-btn w-100">
                                Login
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Don't have an account?
                            <a href="{% url 'register' %}" class="auth-link">
                                Register here
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}
